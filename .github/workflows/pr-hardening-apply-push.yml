name: Apply PR hardening patch on branch

on:
  push:
    branches:
      - feat/v0.3.9-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-hardening-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/v0.3.9-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply, verify, and commit the deterministic patch
        shell: bash
        run: bash .github/pr-hardening-apply.sh
