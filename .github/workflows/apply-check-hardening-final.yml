name: Apply final check hardening

on:
  push:
    branches:
      - fix/check-reliability-and-performance

permissions:
  contents: write

concurrency:
  group: apply-check-hardening-final
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/check-reliability-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch in isolated workspace
        shell: bash
        run: |
          python scripts/apply_check_hardening_final.py
          gofmt -w *.go
      - name: Run tests and vet
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Run race detector
        if: runner.os != 'Windows'
        shell: bash
        run: go test -race ./...

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/check-reliability-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce verified patch
        run: |
          python scripts/apply_check_hardening_final.py
          gofmt -w *.go
          go test ./...
          go vet ./...
      - name: Commit Go changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          if git diff --cached --quiet; then
            echo "No Go changes to commit."
            exit 0
          fi
          git commit -m "fix(check): complete reliability and performance hardening"
          git pull --rebase origin fix/check-reliability-and-performance
          git push origin HEAD:fix/check-reliability-and-performance
