name: One-shot check hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/check-reliability-and-performance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply remaining hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def replace_function(path, name, replacement):
              text = read(path)
              pattern = re.compile(rf"(?ms)^func {re.escape(name)}\(.*?(?=^func |^type |\Z)")
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"function {name} not found in {path}")
              write(path, text[:match.start()] + replacement.rstrip() + "\n\n" + text[match.end():])

          # Tracked/copied skills explicitly request a checked-out worktree.
          replace_once(
              "tracked.go",
              "cache, err := session.source(entry.Source, entry.Ref)",
              "cache, err := session.worktreeSource(entry.Source, entry.Ref)",
          )
          replace_function(
              "tracked.go",
              "syncSource",
              '''func syncSource(ctx context.Context, source, ref string) (string, error) {
          \treturn syncWorktreeSource(ctx, source, ref)
          }''',
          )
          replace_function(
              "tracked.go",
              "sourceSkillPath",
              '''func sourceSkillPath(cache, path string) (string, error) {
          \tif path == "" {
          \t\treturn "", fmt.Errorf("tracked source path is empty")
          \t}
          \tclean := filepath.Clean(filepath.FromSlash(path))
          \tif clean == "." || filepath.IsAbs(clean) || clean == ".." || strings.HasPrefix(clean, ".."+string(filepath.Separator)) {
          \t\treturn "", fmt.Errorf("tracked source path %q is invalid", path)
          \t}
          \t// Provider checks keep object caches unmaterialized. A provider
          \t// update pays checkout cost only when it actually needs files.
          \tif _, err := gitOutput(cache, "rev-parse", "--verify", "refs/skillctl/selected^{commit}"); err == nil {
          \t\tif _, err := gitOutput(cache, "checkout", "--force", "--detach", "refs/skillctl/selected"); err != nil {
          \t\t\treturn "", fmt.Errorf("materialize provider source: %w", err)
          \t\t}
          \t}
          \ttarget := filepath.Join(cache, clean)
          \tif !within(cache, target) {
          \t\treturn "", fmt.Errorf("tracked source path %q escapes source root", path)
          \t}
          \tinfo, err := os.Stat(target)
          \tif err != nil {
          \t\treturn "", fmt.Errorf("tracked source path %q: %w", path, err)
          \t}
          \tif !info.IsDir() {
          \t\treturn "", fmt.Errorf("tracked source path %q is not a directory", path)
          \t}
          \treturn target, nil
          }''',
          )
          tracked = read("tracked.go")
          if "exec." not in tracked:
              tracked = tracked.replace('\t"os/exec"\n', '')
          if "time." not in tracked:
              tracked = tracked.replace('\t"time"\n', '')
          write("tracked.go", tracked)

          # Object caches are normal repositories with no checkout. This keeps
          # provider checks cheap while allowing sourceSkillPath to materialize
          # the selected revision lazily for an actual update.
          cache = read("source_cache.go")
          cache = cache.replace('''\tif kind == "object" {
          \t\tname += ".git"
          \t}
          ''', '')
          cache = re.sub(
              r'(?ms)^func validObjectCache\(cache string\) bool \{.*?^\}',
              '''func validObjectCache(cache string) bool {
          \treturn validWorktreeCache(cache)
          }''',
              cache,
              count=1,
          )
          cache = cache.replace("cloneSourceAtomically(ctx, source, cache, true)", "cloneSourceAtomically(ctx, source, cache, false)")
          cache = cache.replace('gitNetworkOutput(ctx, cache, "fetch", "--prune", "--force", "--recurse-submodules=no", "origin", "+refs/heads/*:refs/heads/*", "+refs/tags/*:refs/tags/*")', 'gitNetworkOutput(ctx, cache, "fetch", "--prune", "--force", "--recurse-submodules=no", "origin")')
          cache = cache.replace("resolveObjectRevision(cache, ref)", "resolveSourceRevision(cache, ref)", 1)
          write("source_cache.go", cache)

          # Every network Git operation must fail instead of opening a hidden
          # credential prompt. Repository dirtiness is scoped to installed
          # skill paths, so an unrelated README edit does not taint all skills.
          git_repo = read("git_repository.go")
          marker = 'cmd := exec.CommandContext(ctx, "git", append([]string{"-C", dir}, args...)...)'
          if marker in git_repo and marker + "\n\tcmd.Env" not in git_repo:
              git_repo = git_repo.replace(marker, marker + "\n\tcmd.Env = gitNonInteractiveEnv()", 1)
          if 'status, err := gitOutput(root, "status", "--porcelain")' not in git_repo:
              raise SystemExit("git status probe not found")
          git_repo = git_repo.replace('status, err := gitOutput(root, "status", "--porcelain")', 'dirty, err := repositorySkillsDirty(root, items)', 1)
          git_repo = git_repo.replace('status != ""', 'dirty', 1)
          write("git_repository.go", git_repo)

          write("git_dirty.go", '''package main

          import (
          \t"fmt"
          \t"path/filepath"
          )

          func repositorySkillsDirty(root string, items []skill) (bool, error) {
          \tfor _, item := range items {
          \t\trelative, err := filepath.Rel(root, item.Path)
          \t\tif err != nil {
          \t\t\treturn false, fmt.Errorf("resolve skill path %s: %w", item.Path, err)
          \t\t}
          \t\tstatus, err := gitOutput(root, "status", "--porcelain", "--", relative)
          \t\tif err != nil {
          \t\t\treturn false, err
          \t\t}
          \t\tif status != "" {
          \t\t\treturn true, nil
          \t\t}
          \t}
          \treturn false, nil
          }
          ''')

          # Read only the bounded YAML front matter; a large skill body no
          # longer becomes a second full-file allocation during metadata checks.
          skill_doc = read("skill_document.go")
          if "os.ReadFile(path)" not in skill_doc:
              raise SystemExit("skill document read not found")
          skill_doc = skill_doc.replace("os.ReadFile(path)", "readSkillFrontMatter(path)", 1)
          if "os." not in skill_doc:
              skill_doc = skill_doc.replace('\t"os"\n', '')
          write("skill_document.go", skill_doc)
          write("skill_document_reader.go", '''package main

          import (
          \t"bufio"
          \t"bytes"
          \t"fmt"
          \t"io"
          \t"os"
          \t"strings"
          )

          const maxSkillFrontMatterBytes = 256 * 1024

          func readSkillFrontMatter(path string) ([]byte, error) {
          \tfile, err := os.Open(path)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdefer file.Close()

          \treader := bufio.NewReader(file)
          \tvar content bytes.Buffer
          \ttotal := 0
          \tlineNumber := 0
          \tfor {
          \t\tline, readErr := reader.ReadString('\\n')
          \t\tlineNumber++
          \t\ttotal += len(line)
          \t\tif total > maxSkillFrontMatterBytes {
          \t\t\treturn nil, fmt.Errorf("front matter exceeds %d bytes", maxSkillFrontMatterBytes)
          \t\t}
          \t\tcontent.WriteString(line)
          \t\ttrimmed := strings.TrimSpace(line)
          \t\tif lineNumber == 1 && trimmed != "---" {
          \t\t\treturn content.Bytes(), nil
          \t\t}
          \t\tif lineNumber > 1 && trimmed == "---" {
          \t\t\treturn content.Bytes(), nil
          \t\t}
          \t\tif readErr != nil {
          \t\t\tif readErr == io.EOF {
          \t\t\t\treturn nil, fmt.Errorf("unterminated front matter")
          \t\t\t}
          \t\t\treturn nil, readErr
          \t\t}
          \t}
          }
          ''')

          # Provider rollback snapshots live outside scan roots. Failed cleanup
          # is visible instead of silently leaving a fake installed skill.
          write("provider_transactions.go", '''package main

          import (
          \t"fmt"
          \t"os"
          \t"path/filepath"
          )

          func providerTransactionRoot() (string, error) {
          \tcache, err := os.UserCacheDir()
          \tif err != nil {
          \t\treturn "", fmt.Errorf("find user cache directory: %w", err)
          \t}
          \troot := filepath.Join(cache, "skillctl", "transactions")
          \tif err := os.MkdirAll(root, 0o700); err != nil {
          \t\treturn "", fmt.Errorf("create provider transaction directory: %w", err)
          \t}
          \treturn root, nil
          }
          ''')

          snapshot_pattern = re.compile(r'(?m)^\tparent := filepath\.Dir\([^\n]+\)\n\t(?P<variable>[A-Za-z_]\w*), err := os\.MkdirTemp\(parent, "\.skillctl-provider-snapshot-"\)')
          cleanup_pattern = re.compile(r'(?ms)^func \(s \*(?P<type>[A-Za-z_]\w*)\) cleanup\(\) \{\n\t_ = os\.RemoveAll\(s\.directory\)\n\}')
          for provider_file in ("vercel_provider.go", "gh_provider.go"):
              provider = read(provider_file)
              provider, count = snapshot_pattern.subn(lambda m: '\tparent, err := providerTransactionRoot()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\t' + m.group('variable') + ', err := os.MkdirTemp(parent, "provider-snapshot-")', provider)
              if count == 0:
                  raise SystemExit(f"snapshot creation not found in {provider_file}")
              provider, cleanup_count = cleanup_pattern.subn(lambda m: 'func (s *' + m.group('type') + ') cleanup() error {\n\treturn os.RemoveAll(s.directory)\n}', provider)
              if cleanup_count == 0:
                  raise SystemExit(f"snapshot cleanup not found in {provider_file}")
              old_defer = "defer snapshot.cleanup()"
              if old_defer not in provider:
                  raise SystemExit(f"snapshot defer not found in {provider_file}")
              provider = provider.replace(old_defer, '''defer func() {
          \t\tif cleanupErr := snapshot.cleanup(); cleanupErr != nil && progress != nil {
          \t\t\tfmt.Fprintf(progress, "Warning: remove provider snapshot: %v\\n", cleanupErr)
          \t\t}
          \t}()''')
              write(provider_file, provider)

          # Text output now ends with an actionable aggregate summary. Reports
          # are classified on demand because inspect renders before JSON finalization.
          report = read("report.go")
          report = report.replace("\t\tswitch item.State {", "\t\tstate := item.State\n\t\tif state == \"\" {\n\t\t\tstate, _ = classifyReport(item)\n\t\t}\n\t\tswitch state {", 1)
          start = report.index("func printReports(")
          brace = report.index("{", start)
          depth = 0
          end = None
          for i in range(brace, len(report)):
              if report[i] == "{":
                  depth += 1
              elif report[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit("printReports closing brace not found")
          body = report[brace:end]
          if "printReportSummary(w, reports)" not in body:
              report = report[:end] + "\tprintReportSummary(w, reports)\n" + report[end:]
          write("report.go", report)

          # Doctor-visible cleanup for transaction/cache debris. The hook is
          # inserted only when the doctor entrypoint exposes fix/stdout directly.
          write("doctor_transactions.go", '''package main

          import (
          \t"fmt"
          \t"io"
          \t"os"
          \t"path/filepath"
          \t"strings"
          )

          func inspectProviderTransactions(fix bool, stdout io.Writer) {
          \tcache, err := os.UserCacheDir()
          \tif err != nil {
          \t\treturn
          \t}
          \troots := []string{
          \t\tfilepath.Join(cache, "skillctl", "transactions"),
          \t\tfilepath.Join(cache, "skillctl", "sources"),
          \t}
          \tfor _, root := range roots {
          \t\tentries, readErr := os.ReadDir(root)
          \t\tif readErr != nil {
          \t\t\tcontinue
          \t\t}
          \t\tfor _, entry := range entries {
          \t\t\tname := entry.Name()
          \t\t\tif !(strings.HasPrefix(name, "provider-snapshot-") || strings.Contains(name, ".corrupt-") || strings.HasPrefix(name, ".skillctl-source-clone-")) {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tpath := filepath.Join(root, name)
          \t\t\tif fix {
          \t\t\t\tif removeErr := os.RemoveAll(path); removeErr != nil {
          \t\t\t\t\tfmt.Fprintf(stdout, "[warning] could not remove orphan transaction %s: %v\\n", path, removeErr)
          \t\t\t\t} else {
          \t\t\t\t\tfmt.Fprintf(stdout, "[fixed] removed orphan transaction %s\\n", path)
          \t\t\t\t}
          \t\t\t} else {
          \t\t\t\tfmt.Fprintf(stdout, "[warning] orphan transaction/cache entry: %s\\n", path)
          \t\t\t}
          \t\t}
          \t}
          }
          ''')
          doctor = read("doctor.go")
          inserted = False
          for function_name in ("runDoctor", "doctor"):
              match = re.search(rf'func {function_name}\((?P<params>[^)]*)\)[^{{]*\{{', doctor)
              if not match:
                  continue
              params = match.group("params")
              if "fix bool" in params and "stdout io.Writer" in params:
                  doctor = doctor[:match.end()] + "\n\tinspectProviderTransactions(fix, stdout)" + doctor[match.end():]
                  inserted = True
                  break
          write("doctor.go", doctor)

          write("reliability_test.go", '''package main

          import (
          \t"bytes"
          \t"context"
          \t"fmt"
          \t"os"
          \t"os/exec"
          \t"path/filepath"
          \t"regexp"
          \t"strconv"
          \t"strings"
          \t"sync/atomic"
          \t"testing"
          \t"time"
          )

          func writeReliabilitySkill(t *testing.T, dir, name string) {
          \tt.Helper()
          \tif err := os.MkdirAll(dir, 0o755); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tcontent := fmt.Sprintf("---\\nname: %s\\ndescription: reliability test\\n---\\n", name)
          \tif err := os.WriteFile(filepath.Join(dir, "SKILL.md"), []byte(content), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          }

          func TestScanIgnoresTransactionDirectories(t *testing.T) {
          \troot := t.TempDir()
          \twriteReliabilitySkill(t, filepath.Join(root, "real"), "real-skill")
          \twriteReliabilitySkill(t, filepath.Join(root, ".skillctl-provider-snapshot-123"), "snapshot-skill")
          \twriteReliabilitySkill(t, filepath.Join(root, ".skillctl-stage-123"), "stage-skill")
          \tvar stderr bytes.Buffer
          \titems, failed := scan([]scanRoot{{Path: root, Host: "test", Scope: "user", Required: true}}, false, &stderr)
          \tif failed {
          \t\tt.Fatalf("scan failed: %s", stderr.String())
          \t}
          \tif len(items) != 1 || items[0].Name != "real-skill" {
          \t\tt.Fatalf("unexpected scan result: %#v", items)
          \t}
          }

          func TestScanStopsInsideValidSkillRoot(t *testing.T) {
          \troot := t.TempDir()
          \touter := filepath.Join(root, "outer")
          \twriteReliabilitySkill(t, outer, "outer-skill")
          \twriteReliabilitySkill(t, filepath.Join(outer, "references", "nested"), "nested-skill")
          \tvar stderr bytes.Buffer
          \titems, failed := scan([]scanRoot{{Path: root, Host: "test", Scope: "user", Required: true}}, false, &stderr)
          \tif failed || len(items) != 1 || items[0].Name != "outer-skill" {
          \t\tt.Fatalf("unexpected scan result: failed=%v items=%#v stderr=%s", failed, items, stderr.String())
          \t}
          }

          func TestSourceDisplayLabelRemovesCredentials(t *testing.T) {
          \tlabel := sourceDisplayLabel("https://user:secret@example.com/acme/skills.git?token=hidden#fragment", "main")
          \tif label != "example.com/acme/skills@main" {
          \t\tt.Fatalf("unexpected label %q", label)
          \t}
          \tif strings.Contains(label, "secret") || strings.Contains(label, "hidden") {
          \t\tt.Fatalf("credentials leaked in %q", label)
          \t}
          }

          func TestSourceElapsedExcludesWorkerQueueTime(t *testing.T) {
          \toriginal := syncSourceForSession
          \tdefer func() { syncSourceForSession = original }()
          \tgate := make(chan struct{})
          \tvar calls atomic.Int32
          \tsyncSourceForSession = func(ctx context.Context, source, ref string) (string, error) {
          \t\tn := calls.Add(1)
          \t\tif n <= maxConcurrentSourceChecks {
          \t\t\tselect {
          \t\t\tcase <-gate:
          \t\t\tcase <-ctx.Done():
          \t\t\t\treturn "", ctx.Err()
          \t\t\t}
          \t\t} else {
          \t\t\ttime.Sleep(5 * time.Millisecond)
          \t\t}
          \t\treturn source, nil
          \t}
          \tgo func() {
          \t\ttime.Sleep(80 * time.Millisecond)
          \t\tclose(gate)
          \t}()
          \tvar progress bytes.Buffer
          \tsession := newSourceSession(context.Background(), time.Second, &progress)
          \trequests := make([]sourceRequest, 5)
          \tfor i := range requests {
          \t\trequests[i] = sourceRequest{Source: fmt.Sprintf("https://example.com/source-%d.git", i+1), Skills: []string{fmt.Sprintf("skill-%d", i+1)}}
          \t}
          \tsession.prefetch(requests)
          \tmatch := regexp.MustCompile(`Remote source 5/5 ready: .* \\((\\d+)ms\\)`).FindStringSubmatch(progress.String())
          \tif len(match) != 2 {
          \t\tt.Fatalf("source 5 timing missing:\\n%s", progress.String())
          \t}
          \tmillis, _ := strconv.Atoi(match[1])
          \tif millis >= 50 {
          \t\tt.Fatalf("queue delay leaked into execution time: %dms\\n%s", millis, progress.String())
          \t}
          }

          func TestMergedReportDoesNotBorrowAnotherInstallationPath(t *testing.T) {
          \tfirst := reportFor(skill{Name: "shared", Path: "/first"}, "provider-a", "owner-a", nil, "clean", "up to date", false, "report-only", "")
          \tsecond := reportFor(skill{Name: "shared", Path: "/second"}, "provider-b", "owner-b", nil, "unknown", "provider check failed", false, "report-only", "network timeout")
          \tmerged := mergeReportsByIdentity([]report{first, second})
          \tif len(merged) != 1 || merged[0].Path != "" {
          \t\tt.Fatalf("merged report retained a misleading path: %#v", merged)
          \t}
          \tif len(merged[0].Installations) != 2 {
          \t\tt.Fatalf("installation detail lost: %#v", merged[0])
          \t}
          }

          func TestSkillDocumentReaderIgnoresLargeBody(t *testing.T) {
          \tpath := filepath.Join(t.TempDir(), "SKILL.md")
          \tbody := strings.Repeat("body line\\n", 2_000_000)
          \tcontent := "---\\nname: large-body\\ndescription: bounded reader\\n---\\n" + body
          \tif err := os.WriteFile(path, []byte(content), 0o644); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tdocument, err := readSkillDocument(path)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif document.Name != "large-body" {
          \t\tt.Fatalf("unexpected document: %#v", document)
          \t}
          }

          func TestObjectSourceCacheDefersCheckout(t *testing.T) {
          \tif _, err := exec.LookPath("git"); err != nil {
          \t\tt.Skip("git not installed")
          \t}
          \thome := t.TempDir()
          \tt.Setenv("HOME", home)
          \tt.Setenv("XDG_CACHE_HOME", filepath.Join(home, "cache"))
          \tt.Setenv("LOCALAPPDATA", filepath.Join(home, "cache"))
          \tsource := filepath.Join(home, "source")
          \twriteReliabilitySkill(t, filepath.Join(source, "demo"), "demo")
          \tfor _, args := range [][]string{{"init"}, {"config", "user.email", "test@example.com"}, {"config", "user.name", "Test"}, {"add", "."}, {"commit", "-m", "initial"}} {
          \t\tcmd := exec.Command("git", args...)
          \t\tcmd.Dir = source
          \t\tif output, err := cmd.CombinedOutput(); err != nil {
          \t\t\tt.Fatalf("git %v: %v: %s", args, err, output)
          \t\t}
          \t}
          \tctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
          \tdefer cancel()
          \tcache, err := syncObjectSource(ctx, source, "")
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif _, err := os.Stat(filepath.Join(cache, "demo", "SKILL.md")); !os.IsNotExist(err) {
          \t\tt.Fatalf("object cache unexpectedly checked out files: %v", err)
          \t}
          \tpath, err := sourceSkillPath(cache, "demo")
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif _, err := os.Stat(filepath.Join(path, "SKILL.md")); err != nil {
          \t\tt.Fatalf("lazy checkout missing skill: %v", err)
          \t}
          }
          ''')
          PY
          gofmt -w scan.go source_cache.go source_session.go report.go inspect.go tracked.go git_repository.go git_dirty.go skill_document.go skill_document_reader.go vercel_provider.go gh_provider.go provider_transactions.go doctor.go doctor_transactions.go reliability_test.go
          go test ./...
      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-check-hardening.yml
          git add -A
          git commit -m "fix(check): harden reliability, diagnostics, and source caching"
          git push origin HEAD:${{ github.head_ref }}
