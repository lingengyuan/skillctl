name: One-shot check hardening v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/check-reliability-and-performance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply idempotent hardening
        run: python3 scripts/one_shot_harden_v2.py
      - name: Format and test
        run: |
          gofmt -w scan.go source_cache.go source_session.go report.go inspect.go tracked.go git_repository.go git_dirty.go skill_document.go skill_document_reader.go vercel_provider.go gh_provider.go provider_transactions.go doctor.go doctor_transactions.go reliability_test.go
          go test ./...
          go vet ./...
      - name: Commit verified result and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-shot-check-hardening.yml .github/workflows/one-shot-check-hardening-v2.yml scripts/one_shot_harden_v2.py
          git add -A
          git commit -m "fix(check): harden reliability, diagnostics, and source caching"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
