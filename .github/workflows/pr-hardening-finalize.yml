name: Finalize PR hardening

on:
  push:
    branches:
      - feat/v0.3.9-hardening
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-hardening-apply
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BRANCH: feat/v0.3.9-hardening
      PR_NUMBER: "5"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/v0.3.9-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Normalize implementation and metadata parser
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          scan = Path("scan.go")
          text = scan.read_text()
          if "readSkillDocument(path)" not in text:
              text = text.replace('\t"bufio"\n', '')
              pattern = re.compile(r'func readSkill\(path string\) \(string, error\) \{.*?\n\}', re.S)
              replacement = '''func readSkill(path string) (string, error) {
          \tdocument, err := readSkillDocument(path)
          \tif err != nil {
          \t\treturn "", err
          \t}
          \tname := document.Name
          \tif name == "" {
          \t\treturn "", errors.New("missing name")
          \t}
          \tif len(name) > 64 {
          \t\treturn "", errors.New("name exceeds 64 characters")
          \t}
          \tif !skillName.MatchString(name) {
          \t\treturn "", fmt.Errorf("invalid name %q: use lowercase letters, numbers, and hyphens", name)
          \t}
          \tif strings.TrimSpace(document.Description) == "" {
          \t\treturn "", errors.New("missing description")
          \t}
          \treturn name, nil
          }'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("could not replace readSkill")
              scan.write_text(text)

          gh = Path("gh_provider.go")
          text = gh.read_text()
          if "readSkillDocument(filepath.Join(item.Path" not in text:
              text = text.replace('\t"bufio"\n', '')
              pattern = re.compile(r'func readGHSkillClaim\(item skill\) ghSkillClaimResult \{.*?\n\}\n\nfunc validGitHubTreeSHA', re.S)
              replacement = '''func readGHSkillClaim(item skill) ghSkillClaimResult {
          \tdocument, err := readSkillDocument(filepath.Join(item.Path, "SKILL.md"))
          \tif err != nil {
          \t\tif errors.Is(err, errMissingFrontMatter) {
          \t\t\treturn ghSkillClaimResult{}
          \t\t}
          \t\treturn ghSkillClaimResult{Err: err}
          \t}
          \tif len(document.Metadata) == 0 {
          \t\treturn ghSkillClaimResult{}
          \t}
          \tclaim := ghSkillClaim{
          \t\tRepository: metadataString(document.Metadata, "github-repo"),
          \t\tRef:        metadataString(document.Metadata, "github-ref"),
          \t\tTreeSHA:    metadataString(document.Metadata, "github-tree-sha"),
          \t\tSkillPath:  metadataString(document.Metadata, "github-path"),
          \t\tLocalPath:  metadataString(document.Metadata, "local-path"),
          \t\tPinned:     metadataBool(document.Metadata, "github-pinned"),
          \t}
          \tif claim.Repository == "" && claim.Ref == "" && claim.TreeSHA == "" && claim.SkillPath == "" && claim.LocalPath == "" && !claim.Pinned {
          \t\treturn ghSkillClaimResult{}
          \t}
          \tif claim.LocalPath != "" && claim.Repository == "" && claim.Ref == "" && claim.TreeSHA == "" && claim.SkillPath == "" {
          \t\treturn ghSkillClaimResult{Claim: claim, Found: true}
          \t}
          \tif !githubRepository.MatchString(claim.Repository) || claim.Ref == "" || !validGitHubTreeSHA(claim.TreeSHA) {
          \t\treturn ghSkillClaimResult{Claim: claim, Found: true, Err: fmt.Errorf("incomplete GitHub skill metadata")}
          \t}
          \tif _, err := githubSkillFolder(claim.SkillPath); err != nil {
          \t\treturn ghSkillClaimResult{Claim: claim, Found: true, Err: fmt.Errorf("invalid github-path")}
          \t}
          \treturn ghSkillClaimResult{Claim: claim, Found: true}
          }

          func validGitHubTreeSHA'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("could not replace readGHSkillClaim")
              if '\t"errors"\n' not in text:
                  text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n')
              gh.write_text(text)
          PY

          if [[ ! -f skill_document.go ]]; then
            cat > skill_document.go <<'EOF'
          package main

          import (
          	"bytes"
          	"errors"
          	"fmt"
          	"os"
          	"strconv"
          	"strings"

          	"gopkg.in/yaml.v3"
          )

          var errMissingFrontMatter = errors.New("missing YAML front matter")

          type skillDocument struct {
          	Name        string         `yaml:"name"`
          	Description string         `yaml:"description"`
          	Metadata    map[string]any `yaml:"metadata"`
          }

          func readSkillDocument(path string) (skillDocument, error) {
          	content, err := os.ReadFile(path)
          	if err != nil {
          		return skillDocument{}, fmt.Errorf("read skill: %w", err)
          	}
          	frontMatter, err := extractFrontMatter(content)
          	if err != nil {
          		return skillDocument{}, err
          	}
          	var document skillDocument
          	decoder := yaml.NewDecoder(bytes.NewReader(frontMatter))
          	if err := decoder.Decode(&document); err != nil {
          		return skillDocument{}, fmt.Errorf("invalid YAML front matter: %w", err)
          	}
          	return document, nil
          }

          func extractFrontMatter(content []byte) ([]byte, error) {
          	normalized := bytes.ReplaceAll(content, []byte("\r\n"), []byte("\n"))
          	lines := bytes.Split(normalized, []byte("\n"))
          	if len(lines) == 0 || !bytes.Equal(bytes.TrimSpace(lines[0]), []byte("---")) {
          		return nil, errMissingFrontMatter
          	}
          	for index := 1; index < len(lines); index++ {
          		if bytes.Equal(bytes.TrimSpace(lines[index]), []byte("---")) {
          			return bytes.Join(lines[1:index], []byte("\n")), nil
          		}
          	}
          	return nil, errors.New("unterminated YAML front matter")
          }

          func metadataString(metadata map[string]any, key string) string {
          	value, ok := metadata[key]
          	if !ok || value == nil {
          		return ""
          	}
          	switch typed := value.(type) {
          	case string:
          		return strings.TrimSpace(typed)
          	case bool:
          		return strconv.FormatBool(typed)
          	case int:
          		return strconv.Itoa(typed)
          	case int64:
          		return strconv.FormatInt(typed, 10)
          	case uint64:
          		return strconv.FormatUint(typed, 10)
          	default:
          		return ""
          	}
          }

          func metadataBool(metadata map[string]any, key string) bool {
          	value, ok := metadata[key]
          	if !ok || value == nil {
          		return false
          	}
          	switch typed := value.(type) {
          	case bool:
          		return typed
          	case string:
          		parsed, err := strconv.ParseBool(strings.TrimSpace(typed))
          		return err == nil && parsed
          	default:
          		return false
          	}
          }
          EOF
          fi

          if [[ ! -f skill_document_test.go ]]; then
            cat > skill_document_test.go <<'EOF'
          package main

          import (
          	"os"
          	"path/filepath"
          	"testing"
          )

          func TestReadSkillDocumentSupportsYAMLFeatures(t *testing.T) {
          	dir := t.TempDir()
          	path := filepath.Join(dir, "SKILL.md")
          	content := `---
          name: yaml-skill
          description: >-
            first line
            second line
          metadata:
            github-repo: example/skills
            github-ref: main
            github-tree-sha: "0123456789012345678901234567890123456789"
            github-path: skills/yaml-skill/SKILL.md
            github-pinned: true
            name: must-not-override
          ---
          body
          `
          	if err := os.WriteFile(path, []byte(content), 0o600); err != nil {
          		t.Fatal(err)
          	}
          	document, err := readSkillDocument(path)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if document.Name != "yaml-skill" || document.Description != "first line second line" {
          		t.Fatalf("unexpected document: %#v", document)
          	}
          	if !metadataBool(document.Metadata, "github-pinned") {
          		t.Fatal("boolean metadata was not parsed")
          	}
          	if name, err := readSkill(path); err != nil || name != "yaml-skill" {
          		t.Fatalf("readSkill = %q, %v", name, err)
          	}
          	claim := readGHSkillClaim(skill{Name: "yaml-skill", Path: dir})
          	if !claim.Found || claim.Err != nil || !claim.Claim.Pinned || claim.Claim.Repository != "example/skills" {
          		t.Fatalf("unexpected GitHub claim: %#v", claim)
          	}
          }

          func TestReadSkillDocumentRejectsMalformedFrontMatter(t *testing.T) {
          	dir := t.TempDir()
          	path := filepath.Join(dir, "SKILL.md")
          	if err := os.WriteFile(path, []byte("---\nname: [\n---\n"), 0o600); err != nil {
          		t.Fatal(err)
          	}
          	if _, err := readSkill(path); err == nil {
          		t.Fatal("malformed YAML unexpectedly succeeded")
          	}
          }
          EOF
          fi

          grep -q 'gopkg.in/yaml.v3' go.mod || go get gopkg.in/yaml.v3@v3.0.1
          go mod tidy

          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text()
          header = text.split("permissions:", 1)[0]
          if "workflow_dispatch:" not in header:
              text = text.replace("on:\n", "on:\n  workflow_dispatch:\n", 1)
              workflow.write_text(text)
          PY

          mkdir -p .github
          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: gomod
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 5
          EOF

          gofmt -w -- *.go

      - name: Run complete Linux validation
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l -- *.go)
          if [[ -n "$files" ]]; then
            printf 'Files need gofmt:\n%s\n' "$files"
            exit 1
          fi
          sh -n scripts/install.sh
          go test ./... -count=1 -timeout 180s
          go test -race ./... -count=1 -timeout 300s
          go test -tags=integration . -run '^TestIntegration' -count=1 -timeout 240s
          go vet ./...

      - name: Cross-compile release targets
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for os in windows darwin linux; do
            for arch in amd64 arm64; do
              suffix=""
              [[ "$os" == windows ]] && suffix=".exe"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$tmp/skillctl-${os}-${arch}${suffix}" .
            done
          done

      - name: Commit final code and remove temporary automation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -E '^var version = ' main.go)" = 'var version = "0.3.8"'

          rm -f \
            .github/workflows/pr-hardening-apply.yml \
            .github/workflows/pr-hardening-apply-push.yml \
            .github/pr-hardening-apply.sh \
            .github/workflows/pr-hardening-finalize.yml

          git add -A
          git diff --cached --check
          git config user.name 'Hugh Lin'
          git config user.email '1062740012@qq.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: complete v0.3.9 hardening validation'
            git push origin HEAD:"$BRANCH"
          fi
          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch authoritative cross-platform CI
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Wait for authoritative CI result
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          final_sha='${{ steps.commit.outputs.final_sha }}'
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$BRANCH" -f event=workflow_dispatch -f per_page=20 \
              --jq ".workflow_runs[] | select(.head_sha == \"$final_sha\") | .id" | head -n 1)
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            gh pr comment "$PR_NUMBER" --body "Final validation could not locate the dispatched CI run for commit \`$final_sha\`. The PR remains draft and no release was created."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 120); do
            status=$(gh run view "$run_id" --json status --jq .status)
            if [[ "$status" == completed ]]; then
              conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion)
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              if [[ "$conclusion" == success ]]; then
                exit 0
              fi
              gh pr comment "$PR_NUMBER" --body "Final cross-platform CI failed for commit \`$final_sha\` (run \`$run_id\`, conclusion: \`$conclusion\`). The PR remains draft and no release was created."
              gh run view "$run_id" --log-failed || true
              exit 1
            fi
            sleep 10
          done
          gh pr comment "$PR_NUMBER" --body "Final cross-platform CI timed out for commit \`$final_sha\` (run \`$run_id\`). The PR remains draft and no release was created."
          exit 1

      - name: Record successful validation
        if: success()
        shell: bash
        run: |
          final_sha='${{ steps.commit.outputs.final_sha }}'
          run_id='${{ steps.ci.outputs.run_id }}'
          gh pr comment "$PR_NUMBER" --body "Final validation passed for commit \`$final_sha\`. GitHub Actions completed the Windows, macOS, and Linux matrix, including unit tests, Git integration tests, formatting, installer syntax checks, race detection on Linux, and \`go vet\`. Runtime version remains \`0.3.8\`; no tag or GitHub Release was created. CI run: \`$run_id\`."
