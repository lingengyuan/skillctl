name: One-shot check hardening v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply idempotent patch in test workspace
        shell: bash
        run: |
          if [ -f scripts/one_shot_harden_v2.py ]; then python3 scripts/one_shot_harden_v2.py; fi
          python3 scripts/one_shot_harden_v3.py
          gofmt -w *.go
      - name: Test
        shell: bash
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

  commit:
    needs: verify
    if: github.head_ref == 'fix/check-reliability-and-performance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply verified patch
        run: |
          if [ -f scripts/one_shot_harden_v2.py ]; then python3 scripts/one_shot_harden_v2.py; fi
          python3 scripts/one_shot_harden_v3.py
          gofmt -w *.go
          go test ./...
          go vet ./...
      - name: Commit result and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/one-shot-check-hardening.yml \
            .github/workflows/one-shot-check-hardening-v2.yml \
            .github/workflows/one-shot-check-hardening-v3.yml \
            scripts/one_shot_harden_v2.py \
            scripts/one_shot_harden_v3.py
          git add -A
          git commit -m "fix(check): harden reliability, diagnostics, and source caching"
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin HEAD:"${{ github.head_ref }}"
