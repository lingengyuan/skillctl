name: Feature request
description: 提出新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体场景与当前的阻碍，不要只写期望的实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
      description: 若涉及新命令或参数，说明它与现有命令的关系
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包含当前绕过方式，例如已有命令的组合
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: skillctl 0.4.1
    validations:
      required: true
